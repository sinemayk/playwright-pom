name: Playwright Tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps
      - name: Run Playwright tests
        run: npx playwright test
        env:
          SAUCE_DEMO_USERNAME_VALID: ${{ secrets.SAUCE_DEMO_USERNAME }}
          SAUCE_DEMO_PASSWORD_VALID: ${{ secrets.SAUCE_DEMO_PASSWORD }}
          OPENSOURCE_URL: ${{ secrets.OPENSOURCE_URL }}
          OPENSOURCE_USERNAME: ${{ secrets.OPENSOURCE_USERNAME }}
          OPENSOURCE_PASSWORD: ${{ secrets.OPENSOURCE_PASSWORD }}
          BASE_URL: ${{ secrets.SAUCE_DEMO_URL }}
          SNACK_URL: ${{ secrets.SNACK_URL }}
          SNACK_USERNAME: ${{ secrets.SNACK_USERNAME }}
          SNACK_PASSWORD: ${{ secrets.SNACK_PASSWORD }}
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
      - name: Get Allure history
        uses: actions/checkout@v4
        if: always()
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages
      - name: gh-pages klasörünün var olduğundan emin ol
        if: always()
        run: mkdir -p gh-pages

      - name: Generate Allure report
        uses: simple-elf/allure-report-action@master
        if: always()
        with:
          allure_results: allure-results
          gh_pages: gh-pages
          allure_report: allure-report
          allure_history: allure-history
      - name: Deploy report to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history
